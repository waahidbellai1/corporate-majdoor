<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Mobile & iPhone friendly viewport -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Corporate Majdoor</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="is-logged-out">

  <!-- =====================
       HEADER / APP BAR
  ====================== -->
  <div class="header app-bar">

    <!-- Profile button (AUTH ONLY via JS) -->
    <button
      id="profileBtn"
      class="profile-btn"
      type="button"
      aria-label="Profile menu"
    >
      <div class="profile-avatar">W</div>
    </button>

    <!-- Center logo -->
    <span>Corporate Majdoor</span>

    <!-- Notification Bell (AUTH ONLY via JS) -->
    <button
      id="notifBell"
      type="button"
      aria-label="Notifications"
    >
      🔔
    </button>

  </div>

  <!-- =====================
       PROFILE MENU
  ====================== -->
  <div id="profileMenu" class="profile-menu">
    <button class="profile-item" type="button">My Profile</button>
    <button class="profile-item" type="button">Settings</button>
    <button
      class="profile-item logout"
      type="button"
      id="profileLogout"
    >
      Logout
    </button>
  </div>

  <!-- =====================
       MAIN CONTAINER
  ====================== -->
  <div class="container">

    <!-- STATUS -->
    <div id="status" aria-live="polite"></div>

    <!-- =====================
         AUTH SECTION
    ====================== -->
    <div id="authSection">
      <input
        id="username"
        placeholder="Username (signup only)"
        autocomplete="username"
      />

      <input
        id="email"
        placeholder="Email"
        type="email"
        autocomplete="email"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <button id="loginBtn" type="button">Login</button>
      <button id="signupBtn" type="button">Sign Up</button>
    </div>

    <!-- LOGOUT (fallback, kept) -->
    <button id="logoutBtn" type="button">Logout</button>

    <!-- =====================
         POST COMPOSER
    ====================== -->
    <div id="postSection">
      <textarea
        id="postInput"
        rows="3"
        maxlength="500"
        placeholder="What corporate pain are you facing today?"
      ></textarea>

      <button id="postBtn" type="button">Post</button>
    </div>

    <!-- =====================
         FEED
    ====================== -->
    <div id="feed"></div>

    <!-- =====================
         NOTIFICATIONS
    ====================== -->
    <div id="notifications">
      <h3>Notifications</h3>
      <div id="notificationList" aria-live="polite"></div>
    </div>

    <!-- =====================
         FOOTER
    ====================== -->
    <div id="footer">
      Developed by <strong>Waahid Ishak</strong>
    </div>

  </div>

  <!-- =====================
       THEME TOGGLE (DESKTOP)
  ====================== -->
  <button
    class="theme-toggle"
    id="themeToggle"
    type="button"
    aria-label="Toggle dark mode"
  >
    🌙
  </button>

  <!-- =====================
       MOBILE BOTTOM BAR
       (SINGLE SOURCE OF TRUTH)
  ====================== -->
  <div class="bottom-bar">

    <!-- Profile -->
    <button
      id="bottomProfileBtn"
      class="bottom-btn"
      type="button"
      aria-label="Profile"
    >
      <div class="bottom-avatar">W</div>
    </button>

    <!-- Dark mode -->
    <button
      id="bottomThemeBtn"
      class="bottom-btn"
      type="button"
      aria-label="Toggle dark mode"
    >
      🌙
    </button>

    <!-- Notifications -->
    <button
      id="bottomNotifBtn"
      class="bottom-btn"
      type="button"
      aria-label="Notifications"
    >
      🔔
    </button>

  </div>

  <!-- =====================
       SCRIPT
  ====================== -->
  <script type="module" src="app.js"></script>

</body>
</html>
