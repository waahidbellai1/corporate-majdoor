<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corporate Majdoor</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <span>Corporate Majdoor</span>
    <!-- Notification Bell (hidden when logged out via JS) -->
    <button id="notifBell" class="notif-bell">🔔</button>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- STATUS -->
    <div id="status"></div>

    <!-- AUTH SECTION -->
    <div id="authSection">
      <input id="username" placeholder="Username (signup only)" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <button id="signupBtn">Sign Up</button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn">Logout</button>

    <!-- POST COMPOSER -->
    <div id="postSection">
      <textarea
        id="postInput"
        placeholder="What corporate pain are you facing today?"
      ></textarea>
      <button id="postBtn">Post</button>
    </div>

    <!-- FEED -->
    <div id="feed"></div>

    <!-- NOTIFICATIONS -->
    <div id="notifications">
      <h3>Notifications</h3>
      <div id="notificationList"></div>
    </div>

    <!-- FOOTER -->
    <div id="footer">
      Developed by <strong>Waahid Ishak</strong>
    </div>

  </div>

  <!-- THEME TOGGLE -->
  <button class="theme-toggle" id="themeToggle">🌙</button>

  <!-- APP SCRIPT -->
  <script type="module" src="app.js"></script>
</body>
</html>
