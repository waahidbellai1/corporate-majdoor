<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corporate Majdoor</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <h1 class="header">Corporate Majdoor</h1>

  <div class="container">

    <div id="status"></div>

    <!-- AUTH CARD -->
    <div id="authSection" class="card auth-card">
      <input id="username" placeholder="Username (signup only)" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />

      <div class="auth-actions">
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
      </div>
    </div>

    <button id="logoutBtn">Logout</button>

    <!-- POST -->
    <div id="postSection" class="card">
      <textarea
        id="postInput"
        placeholder="What corporate pain are you facing today?"
      ></textarea>
      <button id="postBtn">Post</button>
    </div>

    <!-- FEED -->
    <div id="feed"></div>

    <!-- NOTIFICATIONS -->
    <div id="notifications" class="card">
      <h3>Notifications</h3>
      <div id="notificationList"></div>
    </div>

    <footer id="footer">
      Developed by <strong class="brand-name">Waahid Ishak</strong>
    </footer>

  </div>

  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script type="module" src="app.js"></script>
</body>
</html>
