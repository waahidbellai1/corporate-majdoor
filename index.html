<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Mobile & iPhone friendly viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Corporate Majdoor</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER / APP BAR -->
  <div class="header app-bar">

    <!-- Profile button (left) -->
    <button
      id="profileBtn"
      class="profile-btn"
      type="button"
      aria-label="Profile menu"
    >
      <div class="profile-avatar">W</div>
    </button>

    <!-- Center logo (UNCHANGED TEXT) -->
    <span>Corporate Majdoor</span>

    <!-- Notification Bell (right, hidden via JS on login screen) -->
    <button
      id="notifBell"
      type="button"
      aria-label="Notifications"
    >
      🔔
    </button>

  </div>

  <!-- PROFILE MENU (hidden by default) -->
  <div id="profileMenu" class="profile-menu">
    <button class="profile-item" type="button">My Profile</button>
    <button class="profile-item" type="button">Settings</button>
    <button class="profile-item logout" type="button">Logout</button>
  </div>

  <!-- MAIN CONTAINER -->
  <div class="container">

    <!-- STATUS -->
    <div id="status" aria-live="polite"></div>

    <!-- AUTH SECTION -->
    <div id="authSection">
      <input
        id="username"
        placeholder="Username (signup only)"
        autocomplete="username"
      />

      <input
        id="email"
        placeholder="Email"
        type="email"
        autocomplete="email"
      />

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      />

      <!-- Prevent accidental form submit on mobile -->
      <button id="loginBtn" type="button">Login</button>
      <button id="signupBtn" type="button">Sign Up</button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" type="button">Logout</button>

    <!-- POST COMPOSER -->
    <div id="postSection">
      <textarea
        id="postInput"
        placeholder="What corporate pain are you facing today?"
        rows="3"
      ></textarea>

      <button id="postBtn" type="button">Post</button>
    </div>

    <!-- FEED -->
    <div id="feed"></div>

    <!-- NOTIFICATIONS -->
    <div id="notifications">
      <h3>Notifications</h3>
      <div id="notificationList"></div>
    </div>

    <!-- FOOTER -->
    <div id="footer">
      Developed by <strong>Waahid Ishak</strong>
    </div>

  </div>

  <!-- THEME TOGGLE -->
  <button
    class="theme-toggle"
    id="themeToggle"
    type="button"
    aria-label="Toggle dark mode"
  >
    🌙
  </button>

  <script type="module" src="app.js"></script>
</body>
</html>
