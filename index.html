<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Corporate Majdoor</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="header">Corporate Majdoor</div>

  <div class="container">
    <div id="status"></div>

    <!-- AUTH -->
    <div id="authSection">
      <input id="username" placeholder="Username (signup only)" />
      <input id="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <button id="signupBtn">Sign Up</button>
    </div>

    <!-- LOGOUT -->
    <button id="logoutBtn" style="display:none;">Logout</button>

    <!-- POST -->
    <div id="postSection" style="display:none;">
      <textarea id="postInput" placeholder="What corporate pain are you facing today?"></textarea>
      <button id="postBtn">Post</button>
    </div>

    <!-- FEED -->
    <div id="feed"></div>

    <!-- PROFILE -->
    <div id="profileSection" style="display:none;">
      <h2 id="profileName"></h2>
      <div id="profilePosts"></div>
    </div>

    <!-- NOTIFICATIONS -->
    <div id="notifications" style="display:none;">
      <h3>Notifications</h3>
      <div id="notificationList"></div>
    </div>
  </div>

  <!-- THEME -->
  <button class="theme-toggle" id="themeToggle">🌙</button>

  <script type="module" src="app.js"></script>
</body>
</html>
